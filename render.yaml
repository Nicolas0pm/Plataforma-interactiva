# Blueprint de Render: crea DOS servicios separados desde este mismo repositorio:
#   1. plataforma-ingles-kids-api → el backend (FastAPI, Docker)
#   2. plataforma-ingles-kids     → el frontend (sitio estático, sin build)
# Cada uno se despliega por su cuenta. Ver docs/despliegue.md.
services:
  - type: web
    name: plataforma-ingles-kids-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: USE_FAKE_DB
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: plataforma-ingles-kids
      - key: FIREBASE_REALTIME_DB_URL
        value: https://plataforma-ingles-kids-default-rtdb.firebaseio.com
      - key: CORS_ORIGINS
        value: https://plataforma-ingles-kids.onrender.com,https://plataforma-ingles-kids.web.app
      - key: REWARD_THRESHOLD
        value: "100"
      - key: JWT_PIN_EXP_MINUTOS
        value: "30"
      # Secretos generados por Render (no se ven en el repositorio)
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        sync: false
      - key: DEVICE_SHARED_SECRET
        generateValue: true
      # Contenido de serviceAccountKey.json (se pega en el panel de Render)
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

  - type: web
    name: plataforma-ingles-kids
    runtime: static
    rootDir: frontend
    # Sin build: son HTML/CSS/JS puros. Solo se quita el servidor de desarrollo.
    buildCommand: rm -f dev-server.py
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Sin versiones en los nombres de archivo: que el navegador siempre revise si hay cambios
      - path: /*
        name: Cache-Control
        value: no-cache
