# Blueprint de Render: despliega solo el backend (la API). El frontend va aparte
# en Firebase Hosting. Ver docs/despliegue.md.
services:
  - type: web
    name: plataforma-ingles-kids-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: USE_FAKE_DB
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: plataforma-ingles-kids
      - key: FIREBASE_REALTIME_DB_URL
        value: https://plataforma-ingles-kids-default-rtdb.firebaseio.com
      - key: CORS_ORIGINS
        value: https://plataforma-ingles-kids.web.app,https://plataforma-ingles-kids.firebaseapp.com
      - key: REWARD_THRESHOLD
        value: "100"
      - key: JWT_PIN_EXP_MINUTOS
        value: "30"
      # Secretos generados por Render (no se ven en el repositorio)
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        sync: false
      - key: DEVICE_SHARED_SECRET
        generateValue: true
      # Contenido de serviceAccountKey.json (se pega en el panel de Render)
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
