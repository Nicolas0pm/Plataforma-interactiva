<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("pik_tema")||"auto"}catch(e){document.documentElement.dataset.tema="auto"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Aprendamos inglés!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-actions">
      <button type="button" class="btn-volver" data-volver="index.html" data-i18n="nav.back">Volver</button>
    </div>
    <div class="topbar-actions">
      <button type="button" data-lang-toggle>EN</button>
    </div>
  </div>

  <main>
    <div class="card" id="card-login">
      <h2 data-i18n="login.title">Iniciar sesión</h2>
      <form id="form-login">
        <label for="usuario" data-i18n="login.user">Usuario</label>
        <input id="usuario" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" />
        <label for="password" data-i18n="login.password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password" maxlength="128" />
        <button type="submit" data-i18n="login.submit">Entrar</button>
      </form>
      <p class="error-msg" id="error-login" role="alert"></p>
      <p class="hint" data-i18n="login.who_creates">Tu usuario y tu primera contraseña te los da el coordinador de la plataforma.</p>
      <p class="hint" data-i18n="login.forgot">¿Olvidaste tu contraseña? Pídele al coordinador una contraseña temporal.</p>
    </div>

    <div class="card oculto" id="card-primer-ingreso">
      <h2>🔑 <span data-i18n="first.title">Crea tu contraseña</span></h2>
      <p class="hint" data-i18n="first.hint">Es tu primer ingreso: cambia la contraseña temporal por una que solo tú sepas.</p>
      <form id="form-primer-ingreso">
        <label for="primera-nueva" data-i18n="password.new">Contraseña nueva</label>
        <input id="primera-nueva" type="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="primera-hint" />
        <p class="hint" id="primera-hint" data-i18n="login.password_hint">Mínimo 8 caracteres.</p>
        <label for="primera-repetir" data-i18n="password.repeat">Repite la contraseña nueva</label>
        <input id="primera-repetir" type="password" required minlength="8" maxlength="128" autocomplete="new-password" />
        <label class="casilla">
          <input id="primera-terminos" type="checkbox" required />
          <span><span data-i18n="terms.accept">He leído y acepto los</span>
          <a href="terminos.html" target="_blank" data-i18n="terms.link">Términos de uso y la Política de datos</a>.</span>
        </label>
        <button type="submit" data-i18n="first.save">Guardar y entrar</button>
      </form>
      <p class="error-msg" id="error-primer-ingreso" role="alert"></p>
    </div>
  </main>

  <script type="module" src="js/pages/adult-login.js"></script>
</body>
</html>
