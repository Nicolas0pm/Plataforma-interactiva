<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("pik_tema")||"auto"}catch(e){document.documentElement.dataset.tema="auto"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Aprendamos inglés!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-actions">
      <button type="button" class="btn-volver" data-volver="index.html" data-i18n="nav.back">Volver</button>
    </div>
    <div class="topbar-actions">
      <button type="button" data-lang-toggle>EN</button>
    </div>
  </div>

  <main>
    <div class="card oculto" id="card-verificar">
      <h2>📧 <span data-i18n="verify.title">Confirma tu correo</span></h2>
      <p id="verificar-texto"></p>
      <form id="form-verificar">
        <label for="codigo-verificacion" data-i18n="verify.code">Código de 6 dígitos</label>
        <input id="codigo-verificacion" class="campo-codigo" type="text" inputmode="numeric" pattern="\d{6}"
               maxlength="6" required autocomplete="one-time-code" placeholder="123456" />
        <button type="submit" data-i18n="verify.submit">Confirmar</button>
      </form>
      <p class="error-msg" id="error-verificar" role="alert"></p>
      <p class="hint" id="verificar-aviso" role="status"></p>
      <div class="acciones-verificar">
        <button type="button" class="secundario" id="btn-reenviar" data-i18n="verify.resend">Enviar otro código</button>
        <button type="button" class="secundario" id="btn-otra-cuenta" data-i18n="verify.other_account">Usar otra cuenta</button>
      </div>
      <p class="hint" data-i18n="verify.spam_hint">¿No te llega? Revisa la carpeta de spam o correo no deseado.</p>
    </div>

    <div class="card" id="card-login">
      <h2 data-i18n="login.title">Iniciar sesión</h2>
      <form id="form-login">
        <label for="email" data-i18n="login.email">Correo</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password" data-i18n="login.password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button type="submit" data-i18n="login.submit">Entrar</button>
      </form>
      <p class="error-msg" id="error-login"></p>
      <p class="hint" id="hint-firebase"></p>
    </div>

    <div class="card" id="card-registro">
      <h2 data-i18n="login.create_account">Crear cuenta</h2>
      <form id="form-registro">
        <label for="reg-nombre" data-i18n="login.name">Nombre</label>
        <input id="reg-nombre" type="text" required />
        <label for="reg-email" data-i18n="login.email">Correo</label>
        <input id="reg-email" type="email" required autocomplete="username" />
        <label for="reg-password" data-i18n="login.password">Contraseña</label>
        <input id="reg-password" type="password" required minlength="6" autocomplete="new-password" />
        <label class="casilla">
          <input id="reg-terminos" type="checkbox" required />
          <span><span data-i18n="terms.accept">He leído y acepto los</span>
          <a href="terminos.html" target="_blank" data-i18n="terms.link">Términos de uso y la Política de datos</a>.</span>
        </label>
        <button type="submit" data-i18n="login.create_account">Crear cuenta</button>
      </form>
      <p class="error-msg" id="error-registro"></p>
    </div>

    <details class="card" id="card-dev">
      <summary data-i18n="login.dev_mode">Modo de prueba (sin Firebase)</summary>
      <p class="hint" data-i18n="login.dev_hint">Solo funciona si el backend corre con USE_FAKE_DB=true.</p>

      <form id="form-dev-login">
        <label for="dev-id" data-i18n="login.dev_id">ID de usuario</label>
        <input id="dev-id" type="text" required />
        <button type="submit" data-i18n="login.dev_login">Entrar (prueba)</button>
      </form>
      <p class="error-msg" id="error-dev-login"></p>

      <hr />

      <form id="form-dev-registro">
        <label for="dev-reg-nombre" data-i18n="login.name">Nombre</label>
        <input id="dev-reg-nombre" type="text" required />
        <button type="submit" class="secundario" data-i18n="login.dev_create">Crear cuenta de prueba</button>
      </form>
      <p class="hint" id="dev-registro-resultado"></p>
    </details>
  </main>

  <script type="module" src="js/pages/adult-login.js"></script>
</body>
</html>
