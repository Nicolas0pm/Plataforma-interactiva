<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("pik_tema")||"auto"}catch(e){document.documentElement.dataset.tema="auto"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Aprendamos inglés!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1 data-i18n="teacher.title">Panel del docente</h1>
    <div class="topbar-actions">
      <button type="button" data-lang-toggle>EN</button>
      <button type="button" id="btn-logout" data-i18n="nav.logout">Cerrar sesión</button>
    </div>
  </div>

  <main class="wide">
    <!-- Botones de vista: cada uno muestra su lista abajo -->
    <div class="stat-row botones-vista" role="tablist" aria-label="Vistas del panel">
      <button type="button" role="tab" class="stat-tile verde" data-vista="estudiantes" aria-selected="true">
        <span class="valor" id="stat-total">0</span>
        <span class="etiqueta">👧 <span data-i18n="teacher.total_students">Estudiantes</span></span>
      </button>
      <button type="button" role="tab" class="stat-tile naranja" data-vista="ayuda" aria-selected="false">
        <span class="valor" id="stat-ayuda">0</span>
        <span class="etiqueta">🆘 <span data-i18n="teacher.needs_help">Necesitan ayuda</span></span>
      </button>
      <button type="button" role="tab" class="stat-tile azul" data-vista="progreso" aria-selected="false">
        <span class="valor" id="stat-promedio">0 %</span>
        <span class="etiqueta">📈 <span data-i18n="teacher.avg_progress">Progreso</span></span>
      </button>
      <button type="button" role="tab" class="stat-tile amarillo" data-vista="activos" aria-selected="false">
        <span class="valor" id="stat-activos">0</span>
        <span class="etiqueta">⚡ <span data-i18n="teacher.active_today">Activos hoy</span></span>
      </button>
      <button type="button" role="tab" class="stat-tile morado" data-vista="mundos" aria-selected="false">
        <span class="valor" id="stat-mundos">0</span>
        <span class="etiqueta">🌍 <span data-i18n="worlds.title">Mis mundos</span></span>
      </button>
      <button type="button" role="tab" class="stat-tile azul" data-vista="temario" aria-selected="false">
        <span class="valor" id="stat-temario">0</span>
        <span class="etiqueta">📖 <span data-i18n="syllabus.title">Temario</span></span>
      </button>
    </div>

    <div class="card" id="vista" role="tabpanel" aria-live="polite">
      <h2 id="vista-titulo"></h2>
      <p class="hint" id="vista-ayuda"></p>
      <div id="vista-contenido"><p class="hint" data-i18n="activity.loading">Cargando...</p></div>
    </div>

    <!-- RF05: la máquina de premios (ESP32) del salón -->
    <div class="card">
      <h2>🎁 <span data-i18n="machine.title">Máquina de premios del salón</span></h2>
      <p class="hint" data-i18n="machine.hint"></p>
      <form id="form-maquina" class="fila-form">
        <label for="maquina-id" class="sr-only" data-i18n="machine.id">ID de la máquina</label>
        <input id="maquina-id" type="text" maxlength="60" placeholder="aula-101" autocomplete="off" />
        <button type="submit" data-i18n="machine.save">Guardar</button>
      </form>
      <p class="hint" id="maquina-estado" role="status"></p>
      <!-- RF06: cada cuántos mundos completados se entrega el premio -->
      <form id="form-premio" class="fila-form premio-cada">
        <label for="premio-cada" data-i18n="machine.every">Entregar un premio cada</label>
        <select id="premio-cada">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option>
        </select>
        <span data-i18n="machine.worlds">mundo(s) completado(s)</span>
      </form>
      <p class="hint" id="premio-estado" role="status"></p>
    </div>

  </main>

  <script type="module" src="js/pages/teacher.js"></script>
</body>
</html>
